<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTask Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header class="main-header">
        <span class="logo">G.F schedule</span>
    </header>

    <div class="container">
        <div class="form-grupo">
            <input type="text" id="tituloInput" placeholder="Título da tarefa" required>
            <textarea id="descricaoInput" placeholder="Descrição da tarefa(opcional)"></textarea>
            
            <label for="dataLimiteInput" class="input-label">Data limite (opcional):</label>
            <input type="date" id="dataLimiteInput">

            <button id="addBtn">Adicionar Tarefa</button>
        </div>

        <ul id="listaTarefas"></ul>
    </div>
    
</body>
</html>
